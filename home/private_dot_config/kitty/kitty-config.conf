# ===== Personal config for Kitty terminal 
# Reload without restart: Ctrl+Shift+F5  |  Docs: https://sw.kovidgoyal.net/kitty/conf/======
# 
# See: https://sw.kovidgoyal.net/kitty/conf/ 
#------------------------
# ======== SHELL INTEGRATION
shell /opt/homebrew/bin/bash
shell_integration enabled
# --- Advanced ---
allow_remote_control yes
filter_notification title:Spam|body:unwanted
terminfo_type path

# --- Performance ---
repaint_delay 20

wayland_enable_ime yes

# Alerts
enable_audio_bell yes
window_alert_on_bell yes
visual_bell_duration 0.2
#command_on_bell none
#visual_bell_color none
#bell_sound_file
#-----OS-specific settings

# ---- macOS
macos_option_as_alt yes
macos_titlebar_color background
macos_show_window_title_in all
macos_colorspace displayp3


# ======= COMMAND PALETTE SLOTS
# 
#
#
# ======= THEME
#include current-theme.conf
 

# ======= TEXT APPEARANCE
# 
font_size 14.0 
# ⮑ Default is 11.0, text for ants

font_family font_family      family='FiraCode Nerd Font Mono' postscript_name=FiraCodeNFM-Light features='cv06 cv16 cv17 cv31 cv30 cv29 cv28 calt ordn -salt ss10 ss09 ss08 ss07 cv14 -aalt tnum'
bold_font        family='FiraCode Nerd Font Mono' postscript_name=FiraCodeNFM-SemBd features='-cv06 -cv16 -cv17 -cv31 -cv30 -cv29 -cv28 calt ordn -salt ss10 ss09 ss08 ss07 -cv14 -aalt tnum'
italic_font      family='FiraCode Nerd Font Mono' postscript_name=FiraCodeNFM-Reg features='-cv06 -cv16 -cv17 -cv31 -cv30 -cv29 -cv28 calt ordn -salt ss10 ss09 ss08 ss07 -cv14 -aalt tnum'
bold_italic_font family='FiraCode Nerd Font Mono' postscript_name=FiraCodeNFM-Med features='-cv06 -cv16 -cv17 -cv31 -cv30 -cv29 -cv28 calt ordn -salt ss10 ss09 ss08 ss07 -cv14 -aalt tnum'

# --- SYMBOLS
narrow_symbols U+1F600-U+1F64F,U+2600-U+26FF 1
symbol_map U+E0A0-U+E0A3,U+E0C0-U+E0C7 FiraCode Nerd Font Mono,U+23FB-U+23FE,U+2665,U+2665,U+26A1 FiraCode Nerd Font Mono

modify_font cell_height 110% baseline +2px underline_thickness 1px strikethrough_thickness 150%
# ======= LAYOUTS
#enabled_layouts splits:equalize_on_close=true;

remember_window_position yes
window_border_width 1pt
window_padding_width 12
draw_minimal_borders yes
resize_debounce_time 0.1

#active_border_color 
inactive_text_alpha 0.7
confirm_os_window_close 1
# window_logo_path none
# --- Tab Bar ---
tab_bar_edge top
tab_bar_style slant
#active_tab_foreground #e0def4
#active_tab_background #c4a7e7
#inactive_tab_foreground #9a98ab
#inactive_tab_background #454352
progress_bar bottom
tab_activity_symbol 🏃🏽‍♀️‍➡️
tab_title_template {title}
active_tab_font_style bold
inactive_tab_font_style normal
# ======= CURSORS
#
# https://sw.kovidgoyal.net/kitty/conf/#cursor
# ------------
cursor_shape beam
cursor_beam_thickness 2.5
cursor_underline_thickness 2
cursor_shape_unfocused hollow
cursor_blink_interval 0.8 
# ⮑ 0 turns this off, -1 is system default, see 0.5

# ======= SCROLLBAR

scrollbar always
scrollbar_interactive yes 
scrollback_lines 50000
# ⮑ recognizes mouse

# scrollbar_width 0.5 8
# scrollbar_hover_width 1
# scrollbar_handle_opacity .05
# scrollbar_radius 0.3
# scrollbar_min_handle_height 1
# scrollbar_hitbox_expansion 0.25


# pixel_scroll yes (check if touchpad makes this wild)

# Mouse
#copy_on_select a1

#========== MOUSE ===============
#
# https://sw.kovidgoyal.net/kitty/conf/#mouse
# --------------

#=== Defaults

open_url_with default
detect_urls yes
url_style curly
undercurl_style thin-dense
underline_hyperlinks always
show_hyperlink_targets always
pointer_shape_when_dragging hand
default_pointer_shape arrow

#=== Behavior
paste_actions replace-dangerous-control-codes,confirm-if-large,quote-urls-at-prompt 
strip_trailing_spaces smart
select_by_word_characters @-./_~?&=%+#
focus_follows_mouse drop
copy_on_select yes
# === Mouse Mappings
#
# HOW TO: 
# 1. Map a mouse action: mouse_map <button name> <event type> <mode> <action>
# ⮑ Button names: left, right, middle, b1-b8 (≥8 on mouse), keyboard modifiers
# ⮑ Event types: press, release, doublepress, triplepress, click, doubleclick
# ⮑ Modes: grabbed, ungrabbed (whether the program "grabbed" the mouse)
# ⮑ Actions: See  https://sw.kovidgoyal.net/kitty/actions/#mouse-actions
#
# 2. ID mouse events:  kitty --debug-input
# 
# 3. Map it to nothing: Leave it blank. 
# ⮑ mouse_map left click ungrabbed
# 
# -------------------------------

# Paste from clipboard on right-click 
mouse_map right press grabbed,ungrabbed paste_from_clipboard

# Allow middle-click to paste from the primary selection (standard Linux behavior)
mouse_map middle release ungrabbed paste_from_selection   
# Extend mouse selection when you already selected something
mouse_map shift+left press ungrabbed mouse_selection extend
# ⮑ right click an output to select the whole thing

# ======== KEYBOARD ==========
#
# https://sw.kovidgoyal.net/kitty/mapping/
# 
# Mapping keyboard to Remote Control scripts: https://sw.kovidgoyal.net/kitty/remote-control/
#
# Mapping keys to kittens: https://sw.kovidgoyal.net/kitty/kittens/custom/
# Keybinding syntax: https://sw.kovidgoyal.net/kitty/mapping/#syntax-for-specifying-keys
# 
# ------------------------------
# 
#kitty_mod option
# ==== KEYBOARD MAPPING
#
# Syntax: map <key combo> <setting>
# Mappable commands: https://sw.kovidgoyal.net/kitty/actions/
#
#-------------------------------

map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard
#map fn+c command_palette 

# MAPPING ----- Remote Control scripts

# MAPPING ----- Kittens
