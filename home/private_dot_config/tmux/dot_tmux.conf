# From the internet. 
# ~/.config/tmux/.tmux.conf

# 1. Ergonomics & Navigation
unbind C-b
set -g prefix C-a
bind C-a send-prefix #Ctrl a before any tmux command

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# 2. Mouse & Focus Support
set -g mouse on
set -g focus-events on

# Only enter copy mode if mouse is above the prompt line
unbind -n MouseDrag1Pane
bind-key -n MouseDrag1Pane if-shell -F -t = '#{e|<:#{mouse_y},#{cursor_y}}' "select-pane -t =; copy-mode -M; send-keys -X begin-selection" "send-keys -M"

# Copy and exit copy mode on mouse release
unbind -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy" # Use xclip for Linux

# Keep selection visible after yanking
bind-key -T copy-mode-vi y send-keys -X copy-selection-no-clear


# 3. Performance (Critical for Vim/Neovim users)
set -sg escape-time 0

# 4. Visuals & Colors
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:Tc:RGB"   


# SCROLLBARS
set -g pane-scrollbars on
set -g pane-scrollbars-position right   # or 'left'
# Optional: Customize appearance
# set -g pane-scrollbars-style 'fg=WhiteSmoke,bg=DarkSlateGray'

# 5. Intuitive Splitting (preserves current directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# 6. Reload Config
bind r source-file ~/.config/tmux/.tmux.conf \; display "Config reloaded"
